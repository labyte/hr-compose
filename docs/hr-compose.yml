# hr-compose.yml 完整示例
# 所有字段值直接透传 systemd 对应指令，取值以 systemd 为准。
version: "1.0"
name: myapp                       # 项目名（必填）：unit 文件名前缀 <name>-<service>.service，需全局唯一
services:
  # 依赖 redis，启动时先启 redis
  api:
    description: 主业务 API 服务          # Description，服务描述
    command: /opt/myapp/api            # ExecStart，必须前台运行，不要 daemon
    working_dir: /opt/myapp            # WorkingDirectory
    user: appuser                      # User
    group: appuser                     # Group
    environment:                       # Environment=，每行一条
      - "DB_ADDR=127.0.0.1:3306"
      - "LOG_LEVEL=info"
    restart: on-failure                # Restart，取值：no / on-success / on-failure / on-abnormal / on-abort / on-watchdog / always
    restart_sec: 5                     # RestartSec，重启间隔（秒）
    stop_signal: SIGTERM               # KillSignal，取值：SIGTERM（默认）/ SIGKILL / SIGINT / SIGHUP 等
    stop_timeout: 30                   # TimeoutStopSec，优雅停止宽限期（秒）
    memory_max: 2G                     # MemoryMax，大小带单位：2G / 500M / 1024K
    cpu_quota: 200%                    # CPUQuota，百分比：100% = 1 核，200% = 2 核
    std_output: journal                # StandardOutput/StandardError，取值：null（默认，裸写即可）/ none（兼容旧写法）/ journal / file:<path> / append:<path>
    depends_on:                        # 软依赖默认：After= + Wants=（仅控制顺序，依赖失败不阻塞）；要强依赖加 depends_on_required
      - redis

  # 日志由 redis 自己写 /var/log/redis/redis.log，hr-compose logs 提示 tail 查看
  redis:
    command: /opt/redis/redis-server /opt/redis/redis.conf
    working_dir: /opt/redis
    user: appuser
    restart: always
    std_output: null                   # 丢弃 stdout/stderr（裸写 null 即可）
    log_file: /var/log/redis/redis.log # 仅用于 logs 命令的 tail 提示

  # 演示强依赖 + 启动延时：web 必须等 api 启动成功，api 起来后再等 5 秒才启 web
  web:
    command: /opt/myapp/web
    working_dir: /opt/myapp            # WorkingDirectory
    user: appuser                      # User
    depends_on_required: true          # 强依赖：与 depends_on 一起用，把 Wants= 改写成 Requires=（api 启动失败则 web 不启动；api 被 stop/失败会联动停 web）
    depends_on:                        # 依赖 api，故 up web 会自动带上 api（down web 不连带 api）
      - api
    start_delay: 5                     # 启动前延时秒数：生成 ExecStartPre=/bin/sleep 5，在依赖启动完成后才开始计时
    start_timeout: 120                 # TimeoutStartSec，未配置默认 90；start_delay 计入该超时，延时较大时需同步放宽
