name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Lint
        # action v7 起才支持 golangci-lint v2（v9 用 node24 运行时）。版本钉在 v2.15 而非 latest，
        # 与本地开发环境同版本；配置格式必须与 linter 大版本一致（.golangci.yml 是 version 2），
        # 且 action 默认会按所装版本的 JSON Schema 校验配置，两者不能分开切。
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: Cross-compile
        run: make cross

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: make build

      - name: E2E smoke (systemd)
        run: bash e2e/smoke.sh "$GITHUB_WORKSPACE/bin/hr-compose"
