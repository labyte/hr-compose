name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 离线手册 PDF：随本次 release 一起出，产物名 hr-compose_<版本>_offline-install.pdf
      - name: 安装 PDF 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc fonts-noto-cjk

      - name: 构建离线手册 PDF
        run: make docs DOC_VERSION="${GITHUB_REF_NAME#v}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
