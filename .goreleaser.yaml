# GoReleaser 配置：go get 校验用 goreleaser check 验证
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# install.sh 作为发行资产一并发布，使 online 安装命令可用：
#   curl -fsSL .../releases/latest/download/install.sh | sh
release:
  extra_files:
    - glob: install.sh
